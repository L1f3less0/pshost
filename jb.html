<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">

<title>pshost | afterglow</title>

<style>
:root {
  --bg: #000;
  --panel: #080808;
  --border: #191919;
  --green: #75e6a0;
  --white: #dedede;
  --gray: #666;
  --mono: "Consolas", "DejaVu Sans Mono", monospace;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: #000;
  color: var(--white);
  font-family: var(--mono);
}

body {
  padding-bottom: 25px;
}

#brand {
  padding: 17px;
  text-align: center;
  background: #030303;
  border-bottom: 1px solid #151515;
}

#brand b {
  font-size: 17px;
  letter-spacing: 5px;
  color: white;
}

#ramBox {
  padding: 9px 12px;
  background: #050505;
  border-bottom: 1px solid #151515;
  color: var(--green);
  font: 10px/1.6 var(--mono);
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.container {
  width: min(680px, calc(100% - 28px));
  margin: 35px auto;
}

.panel {
  padding: 18px;
  background: var(--panel);
  border: 1px solid var(--border);
  margin-bottom: 12px;
}

.heading {
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--gray);
  margin-bottom: 18px;
}

.status {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
}

.dot {
  width: 7px;
  height: 7px;
  background: var(--green);
  border-radius: 50%;
  box-shadow: 0 0 9px var(--green);
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  50% { opacity: .25; }
}

#spin {
  width: 35px;
  height: 35px;
  margin: 30px auto;
  border: 2px solid #222;
  border-top-color: var(--green);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

#msg {
  display: none;
  text-align: center;
  padding: 25px 5px;
  font-size: 13px;
}

#state, #out {
  display: none;
}

#state {
  font-size: 13px;
  margin-bottom: 12px;
}

#out {
  max-height: 55vh;
  overflow-y: auto;
  padding: 12px;
  border: 1px solid #171717;
  background: #020202;
  color: #a0d5ad;
  font: 11px/1.7 var(--mono);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

#cancelBtn {
  display: block;
  width: 100%;
  padding: 13px;
  margin-top: 18px;
  border: 1px solid #572323;
  background: #090303;
  color: #e66b6b;
  font: 11px var(--mono);
  letter-spacing: 3px;
  cursor: pointer;
  transition: .2s;
}

#cancelBtn:active {
  background: #261010;
}

#cancelBtn:focus-visible {
  outline: 2px solid var(--green);
  outline-offset: 3px;
}

.notice {
  padding: 12px;
  margin: 12px 0;
  border: 1px solid #803333;
  background: #180707;
  color: #ff8888;
  font-size: 12px;
}

.byline {
  margin-top: 30px;
  text-align: center;
  color: #555;
  font: 9px var(--mono);
  letter-spacing: 1px;
  animation: credits 3s ease-in-out infinite;
}

@keyframes credits {
  0%, 100% {
    opacity: .35;
    transform: translateY(2px);
  }
  50% {
    opacity: .9;
    transform: translateY(0);
  }
}

body.done #spin,
body.fail #spin {
  display: none;
}

body.done #msg,
body.fail #msg {
  display: block;
}

body.done #msg {
  color: var(--green);
}

body.fail #msg {
  color: #e66b6b;
}

body.log {
  min-height: 100vh;
}

body.log #state,
body.log #out {
  display: block;
}

body.log #spin,
body.log #msg {
  display: none;
}

@media(max-width: 480px) {
  .container {
    width: calc(100% - 20px);
    margin: 18px auto;
  }

  .panel {
    padding: 14px;
  }

  #out {
    max-height: 50vh;
    font-size: 10px;
  }

  #brand {
    padding: 14px;
  }
}
</style>
</head>

<body>

<header id="brand">
  <b>PSHOST</b>
</header>

<div id="ramBox">RAM: checking...</div>

<main class="container">

  <section class="panel">
    <div class="heading">SYSTEM STATUS</div>
    <div class="status">
      <span class="dot"></span>
      <span>AFTERGLOW ENVIRONMENT</span>
    </div>
  </section>

  <section class="panel">
    <div class="heading">EXECUTION</div>

    <div id="spin"></div>
    <div id="msg">Restart your console</div>

    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>

    <button id="cancelBtn" type="button">
      CANCEL
    </button>
  </section>

  <div class="byline">
    By: l1f3less0, credits to Well0nez/m0zz
  </div>

</main>

<script>
document.getElementById("cancelBtn").addEventListener("click", () => {
  location.replace("index.html");
});
</script>

<script type="module">
import "./jb.js";
</script>

</body>
</html>
